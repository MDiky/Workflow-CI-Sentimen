name: CI MLProject & Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install mlflow pandas scikit-learn

    - name: Run MLflow Project
      run: |
        cd Workflow-CI/MLProject
        mlflow run . --env-manager=local

    - name: Commit Artifacts to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git pull origin main --rebase
        git add Workflow-CI/MLProject/model_artifact/
        git commit -m "Auto-save model artifact from CI [skip ci]" || echo "Tidak ada perubahan artefak"
        git push

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image using MLflow
      run: |
        cd Workflow-CI/MLProject
        mlflow models build-docker -m model_artifact -n ${{ secrets.DOCKER_USERNAME }}/sentimen-shopee:latest

    - name: Push Docker Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/sentimen-shopee:latest